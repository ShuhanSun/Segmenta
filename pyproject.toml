[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "segmenta-event-store"
version = "0.1.0"
description = "A local, append-only structured event store with recovery and analytics"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Shuhan Sun"}]

[project.scripts]
segmenta = "segmenta.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

